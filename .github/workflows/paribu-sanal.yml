name: Paribu sanal islem

on:
  schedule:
    - cron: "15 0 * * *"     # her gun 00:15 UTC (03:15 TSI), gunluk mum kapandiktan sonra
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paribu-sanal
  cancel-in-progress: false

jobs:
  sanal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birim testleri
        run: python tests/paribu/test_paribu.py

      - name: Sanal islem
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paribu/sanal.py

      - name: Durumu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paribu/durum/sanal.json paribu/SANAL-RAPOR.md 2>/dev/null || true
          git commit -m "Paribu sanal islem: gunluk adim" || echo "degisiklik yok"
          git pull --rebase -q
          git push
