name: Paribu strateji testi

on:
  workflow_dispatch:
    inputs:
      ucret:
        description: "Her yönde ücret (%)"
        default: "0.28"
      ucretler:
        description: "Karşılaştırılacak ücretler (virgüllü, boş bırakılabilir)"
        default: "0.28,0.1,0.01"
      sadece_portfoy:
        description: "Sadece portföy testini çalıştır (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birim testleri
        run: python tests/paribu/test_paribu.py

      - name: Strateji testi
        if: ${{ github.event.inputs.sadece_portfoy != 'true' }}
        env:
          UCRET: ${{ github.event.inputs.ucret }}
          UCRETLER: ${{ github.event.inputs.ucretler }}
        run: python paribu/backtest.py --ucret "${UCRET:-0.28}" --ucretler "${UCRETLER}"

      - name: Portföy testi
        env:
          UCRET: ${{ github.event.inputs.ucret }}
        run: python paribu/portfoy.py --ucret "${UCRET:-0.28}"

      - name: Raporu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paribu/*.md paribu/*.json
          git commit -m "Paribu strateji testi raporu" || echo "degisiklik yok"
          git pull --rebase -q
          git push
