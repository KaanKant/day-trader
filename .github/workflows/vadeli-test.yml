name: Vadeli islem testi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birim testleri
        run: python tests/paribu/test_paribu.py
      - name: Vadeli testi
        run: python paribu/vadeli.py
      - name: Raporu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paribu/VADELI-RAPORU.md
          git commit -m "Vadeli islem testi raporu" || echo "degisiklik yok"
          git pull --rebase -q
          git push
