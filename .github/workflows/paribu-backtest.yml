name: Paribu strateji testi

on:
  workflow_dispatch:
    inputs:
      ucret:
        description: "Her yönde ücret (%)"
        default: "0.25"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birim testleri
        run: python tests/paribu/test_paribu.py

      - name: Strateji testi
        env:
          UCRET: ${{ github.event.inputs.ucret }}
        run: python paribu/backtest.py --ucret "${UCRET:-0.25}"

      - name: Raporu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paribu/BACKTEST-RAPORU.md paribu/BACKTEST-RAPORU.json
          git commit -m "Paribu strateji testi raporu" || echo "degisiklik yok"
          git pull --rebase -q
          git push
